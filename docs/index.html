<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Try three fictional post-visit messages in a bilingual clinical product work sample by Cássio Caetano, MD, founder of Plexo Clínico.">
<title>After the visit · Plexo Clínico</title>
<link rel="stylesheet" href="./style.css">
<script src="./inbox.js" defer></script>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Plexo Clínico</span></div>
<label class="language"><span lang="en">Language</span> / <span lang="pt-BR">Idioma</span> <select id="language"><option value="en" lang="en">English</option><option value="pt" lang="pt-BR">Português</option></select></label></header>
<main>
<section class="intro"><p class="eyebrow" id="kicker"></p><h1 id="headline"></h1><p id="lede"></p></section>
<section class="workspace" aria-labelledby="inbox-title">
<div class="inbox"><h2 id="inbox-title"></h2><div id="list"></div></div>
<article id="message"><div class="meta"><span id="msg-label"></span><span id="state" class="state"></span></div><h2 id="subject"></h2>
<blockquote lang="pt-BR" id="quote"></blockquote><p id="translation" lang="en"></p>
<div class="decision"><h3 id="action-title"></h3><p id="prompt"></p><div class="actions" id="actions"></div><p id="feedback" role="status"></p></div>
</article></section>
<div class="progress"><span id="progress" aria-live="polite"></span><button id="restart" type="button"></button></div>
<section class="source"><div><p class="eyebrow" id="notes-label"></p><h2 id="notes-title"></h2><p id="notes-copy"></p></div><div><a id="art-link" href="https://github.com/drcassiocaetano/plexo-clinical-ai-demo/tree/main/docs/artwork"></a><a id="case-link" href="https://github.com/drcassiocaetano/plexo-clinical-ai-demo#clinical-note-evaluation"></a></div></section>
</main><footer>Cássio Caetano, MD <span>·</span> Plexo Clínico</footer>
<noscript>Enable JavaScript to try the inbox. <a href="https://github.com/drcassiocaetano/plexo-clinical-ai-demo">Read the case study on GitHub.</a></noscript>
</body></html>
